[workspace]
resolver = "2"
members = [
    "crates/ec2ps-protocol",
    "crates/ec2ps-iso9660",
    "crates/ec2ps-core",
    "crates/ec2ps-daemon",
    "crates/ec2ps-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
base64 = "0.22"
ring = "0.17"
libc = "0.2"
