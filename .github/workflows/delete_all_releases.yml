name: Delete All Releases

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-all:
    name: Delete All Existing GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete All Releases via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Querying all releases in $REPO..."
          RELEASES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases")
          echo "$RELEASES" | jq -r '.[] | {id: .id, tag_name: .tag_name, name: .name}'
          
          echo "$RELEASES" | jq -r '.[] | .id' | while read id; do
            if [ -n "$id" ]; then
              echo "Deleting release ID $id..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/releases/$id")
              echo "Delete response for $id: $STATUS"
            fi
          done
          
          echo "Releases after purge:"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases" | jq '.'
