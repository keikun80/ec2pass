name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Clippy & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --no-fail-fast 2>&1 | tee test.log; then
            # Surface failing tests as an annotation (visible without opening the log).
            msg=$(grep -E "^---- |panicked|assertion|^ +left|^ +right|FAILED|^error" test.log \
              | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=cargo test failed on ${{ matrix.os }}::${msg}"
            exit 1
          fi
      - name: Build binaries
        run: cargo build --workspace

  e2e-linux-kvm:
    name: E2E (Linux, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Fail here rather than silently testing the slow TCG path.
          test -r /dev/kvm -a -w /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          qemu-system-x86_64 --version
      - name: Build
        run: cargo build --workspace
      - name: E2E suite
        shell: bash
        env:
          EC2PASS_BIN: target/debug/ec2pass
          EC2PASSD_BIN: target/debug/ec2passd
        run: |
          set -o pipefail
          if ! bash tests/e2e_test.sh 2>&1 | tee e2e.log; then
            msg=$( { tail -n 40 e2e.log; echo '--- daemon log'; tail -n 40 /tmp/ec2passd_e2e.log 2>/dev/null; } \
              | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=E2E failed on Linux (KVM)::${msg}"
            exit 1
          fi
