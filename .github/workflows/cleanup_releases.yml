name: Cleanup Old Releases

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove v0.1.1 and 0.1.0 Releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete Releases via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching releases for $REPO..."
          RELEASES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases")
          echo "$RELEASES" | jq -r '.[] | {id: .id, tag_name: .tag_name, name: .name}'
          
          # Identify IDs matching target tags
          TARGET_IDS=$(echo "$RELEASES" | jq -r '.[] | select(.tag_name == "v0.1.1" or .tag_name == "0.1.0") | .id')
          
          for id in $TARGET_IDS 454217133 453689379; do
            if [ -n "$id" ]; then
              echo "Deleting release ID: $id..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/releases/$id")
              echo "Response code for ID $id: $STATUS"
            fi
          done
          
          echo "Final releases list:"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases" | jq -r '.[] | {id: .id, tag_name: .tag_name, name: .name}'
